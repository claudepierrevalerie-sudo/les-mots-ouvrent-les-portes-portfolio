<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors connexion - Les mots qui ouvrent les portes</title>
  <meta name="theme-color" content="#0d2340">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #0d2340 0%, #123a63 100%);
      color: #ffffff;
      padding: 1.25rem;
      box-sizing: border-box;
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.22);
    }

    h1 {
      margin: 0 0 0.65rem;
      font-size: 1.3rem;
      line-height: 1.25;
    }

    p {
      margin: 0.45rem 0;
      line-height: 1.55;
    }

    a {
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Vous etes actuellement hors connexion.</h1>
    <p>Le mini-site demeure partiellement accessible. Certaines donnees dynamiques peuvent ne pas se charger sans reseau.</p>
    <p>Des que la connexion revient, rechargez la page principale pour retrouver l'ensemble des contenus.</p>
    <p><a href="./index.html">Retourner a l'accueil</a></p>
  </main>
</body>
</html>
